spring.application.name=bce-perpustakaan
server.port=8080

# Database H2 in-memory
spring.datasource.url=jdbc:h2:mem:perpustakaan
spring.datasource.username=SA
spring.datasource.password=
spring.h2.console.enabled=true

# Skema dari schema.sql, data awal dari data.sql
spring.sql.init.mode=always
# validate: aplikasi gagal start bila entity tidak cocok dengan schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
