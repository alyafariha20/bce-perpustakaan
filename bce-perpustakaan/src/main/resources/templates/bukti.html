<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bukti Peminjaman</title>
</head>
<body>
<p><a th:href="@{/pinjam}">Pinjam</a> | <a th:href="@{/buku}">Buku</a> | <a th:href="@{/anggota}">Anggota</a> | <a th:href="@{/stok}">Kelola Stok</a> | <a th:href="@{/reservasi}">Reservasi</a></p>
<h1>Bukti Peminjaman</h1>
<table>
    <tr><td>No. Transaksi</td><td th:text="${bukti.idTransaksi}">T0001</td></tr>
    <tr><td>Anggota</td>      <td th:text="${bukti.namaAnggota}">Nama</td></tr>
    <tr><td>Buku</td>         <td th:text="${bukti.judulBuku}">Judul</td></tr>
    <tr><td>Tanggal</td>      <td th:text="${bukti.tanggalPinjam}">2026-10-25</td></tr>
    <tr><td>Status</td>       <td th:text="${bukti.status}">DIPINJAM</td></tr>
</table>
<a th:href="@{/pinjam}">Kembali</a>
</body>
</html>
